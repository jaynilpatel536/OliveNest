<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    # Alias so all /OliveNest/... paths work seamlessly without redirecting to internal port
    Alias /OliveNest /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
