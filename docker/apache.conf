<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    # Alias so all /OliveNest/... paths work without a subdirectory
    Alias /OliveNest /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Redirect bare / to /OliveNest/ for consistency
    RedirectMatch ^/$ /OliveNest/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
