services:
  - type: web
    name: olivenest
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false   # You will set this manually in Render dashboard
      - key: MONGO_DB
        value: OliveNest
      - key: RAZORPAY_KEY_ID
        sync: false   # Set in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false   # Set in Render dashboard
